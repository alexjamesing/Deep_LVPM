name: Validate installation extras

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

defaults:
  run:
    shell: bash

jobs:
  install:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extra: tf-cpu
            label: linux-tensorflow-cpu
          - os: ubuntu-latest
            extra: tf-gpu
            label: linux-tensorflow-gpu
          - os: ubuntu-latest
            extra: torch-cpu
            label: linux-pytorch-cpu
          - os: ubuntu-latest
            extra: torch-gpu
            label: linux-pytorch-gpu
          - os: macos-14
            extra: tf-apple
            label: macos-apple-tensorflow
          - os: macos-14
            extra: torch-apple
            label: macos-apple-pytorch
          - os: windows-latest
            extra: tf-cpu
            label: windows-intel-tensorflow
          - os: windows-latest
            extra: torch-cpu
            label: windows-intel-pytorch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CUDA-enabled PyTorch wheels
        if: ${{ matrix.extra == 'torch-gpu' }}
        run: |
          python -m pip install --upgrade --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cu124 \
            torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0

      - name: Install Deep LVPM (${{ matrix.extra }})
        run: python -m pip install --upgrade --no-cache-dir ".[${{ matrix.extra }}]"

      - name: Verify imports
        run: |
          python -c "import deep_lvpm; print('Loaded deep_lvpm')"
          if [[ '${{ matrix.extra }}' == tf-* ]]; then
            python -c "import tensorflow as tf; print(f'Loaded tensorflow=={tf.__version__}')"
          elif [[ '${{ matrix.extra }}' == torch-* ]]; then
            python -c "import torch; print(f'Loaded torch=={torch.__version__}')"
          fi
